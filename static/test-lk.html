<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebAR SDK - calcOpticalFlowPyrLK isolation test</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    .pass { color: #0f0; } .fail { color: #f44; } .info { color: #888; }
  </style>
</head>
<body>
  <h1>calcOpticalFlowPyrLK isolation test</h1>
  <p class="info">?build=&lt;vendor file&gt; selects the runtime (default opencv-slim.js).
  Mirrors pipeline.js _trackStep params: win 21x21, 3 levels, EPS|COUNT 30/0.01.</p>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log')
    function log(cls, msg) {
      const d = document.createElement('div')
      d.className = cls
      d.textContent = msg
      logEl.appendChild(d)
      console.log(`[TEST:${cls}] ${msg}`)
    }

    const build = new URLSearchParams(location.search).get('build') || 'opencv-slim.js'
    const script = document.createElement('script')
    script.src = '/static/sdk/vendor/' + build
    script.onload = () => {
      log('info', 'loaded ' + build)
      // Same init dance as vision-worker.js cvReady(): the emscripten module
      // is a thenable that resolves WITH ITSELF, so never resolve a Promise
      // with it - install the global and continue with `cv` afterwards.
      if (typeof cv === 'undefined') { log('fail', 'cv undefined'); return finish(0, 1) }
      if (cv.Mat) run()
      else if (typeof cv.then === 'function') cv.then((mod) => { window.cv = mod; run() })
      else cv.onRuntimeInitialized = () => run()
    }
    script.onerror = () => { log('fail', 'failed to load ' + build); finish(0, 1) }
    document.head.appendChild(script)

    function texture(x, y) {
      const v = Math.sin(x * 0.35) * 43 + Math.cos(y * 0.41) * 47 +
                Math.sin((x + y) * 0.13) * 53 + ((x >> 3 ^ y >> 3) & 1) * 60
      return Math.max(0, Math.min(255, Math.round(128 + v)))
    }

    function run() {
      const W = 256, H = 256, DX = 3, DY = 2
      const img1 = new cv.Mat(H, W, cv.CV_8UC1)
      const img2 = new cv.Mat(H, W, cv.CV_8UC1)
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          img1.data[y * W + x] = texture(x, y)
          img2.data[y * W + x] = texture(x - DX, y - DY)
        }
      }

      const pts = [60, 60, 128, 80, 90, 150, 180, 180, 200, 100, 70, 200]
      const n = pts.length / 2
      const prevPts = cv.matFromArray(n, 1, cv.CV_32FC2, pts)
      const nextPts = new cv.Mat()
      const status = new cv.Mat()
      const err = new cv.Mat()
      const winSize = new cv.Size(21, 21)
      const criteria = new cv.TermCriteria(cv.TermCriteria_EPS | cv.TermCriteria_COUNT, 30, 0.01)

      cv.calcOpticalFlowPyrLK(img1, img2, prevPts, nextPts, status, err, winSize, 3, criteria)

      let ok = 0
      for (let i = 0; i < n; i++) {
        const fx = nextPts.data32F[i * 2] - pts[i * 2]
        const fy = nextPts.data32F[i * 2 + 1] - pts[i * 2 + 1]
        const good = status.data[i] && Math.abs(fx - DX) < 0.5 && Math.abs(fy - DY) < 0.5
        if (good) ok++
        log(good ? 'pass' : 'fail',
          `pt${i} (${pts[i * 2]},${pts[i * 2 + 1]}) status=${status.data[i]} flow=(${fx.toFixed(2)},${fy.toFixed(2)}) ${good ? 'OK' : 'BAD'}`)
      }
      log(ok === n ? 'pass' : 'fail', `expected flow (${DX},${DY}) -> ${ok}/${n} correct`)
      finish(ok, n - ok)
    }

    function finish(passed, failed) {
      window.__TEST_DONE__ = { passed, failed, runtime: build }
    }
  </script>
</body>
</html>
