<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>WebAR Image Tracking</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #000;
        color: #fff;
        overflow: hidden;
        height: 100vh;
        height: 100dvh;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #videoElement {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      #threeCanvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        pointer-events: none;
      }

      .detection-badge {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0, 200, 100, 0.9);
        color: #001a0d;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .detection-badge.visible {
        opacity: 1;
      }

      .toggle-btn {
        position: absolute;
        bottom: 30px;
        right: 20px;
        z-index: 20;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .toggle-btn:active {
        transform: scale(0.95);
      }

      .toggle-btn.active {
        background: rgba(0, 200, 100, 0.8);
      }

      .start-overlay {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background: rgba(0, 0, 0, 0.95);
      }

      .start-overlay.hidden {
        display: none;
      }

      .start-btn {
        padding: 15px 40px;
        font-size: 18px;
        font-weight: 600;
        border: none;
        border-radius: 30px;
        background: linear-gradient(135deg, #00c870, #00a060);
        color: #fff;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .start-btn:active {
        transform: scale(0.95);
      }

      .start-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .start-title {
        font-size: 28px;
        font-weight: 700;
        color: #00c870;
      }

      .start-subtitle {
        color: #888;
        font-size: 14px;
        text-align: center;
        max-width: 320px;
      }

      .permission-status {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
      }

      .permission-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #666;
      }

      .permission-item.granted {
        color: #00c870;
      }

      .permission-item.denied {
        color: #ff4444;
      }

      .permission-item.optional {
        color: #e0b84c;
      }

      .info-panel {
        position: absolute;
        bottom: 100px;
        left: 20px;
        right: 20px;
        z-index: 15;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 15px;
        display: none;
        max-height: 60vh;
        overflow-y: auto;
      }

      .info-panel.visible {
        display: block;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .info-row:last-child {
        border-bottom: none;
      }

      .info-label {
        color: #888;
      }

      .info-value {
        color: #00c870;
        font-weight: 600;
        font-family: monospace;
      }

      .info-section {
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        padding-top: 8px;
        margin-top: 8px;
      }

      .info-section-title {
        color: #fff;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .status-dot {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff4444;
      }

      .status-dot.connected {
        background: #00c870;
      }

      .alignment-link {
        position: absolute;
        bottom: 30px;
        left: 20px;
        z-index: 20;
        padding: 10px 16px;
        border-radius: 25px;
        border: none;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
      }

      .alignment-link:hover {
        background: rgba(0, 200, 100, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <video id="videoElement" autoplay playsinline muted></video>
      <canvas id="threeCanvas"></canvas>

      <div class="status-dot" id="statusDot"></div>
      <div class="detection-badge" id="detectionBadge">Tracking Locked</div>

      <button class="toggle-btn" id="toggleBtn">i</button>
      <a href="/static/alignment-tool/index.html" class="alignment-link">Alignment</a>

      <div class="info-panel" id="infoPanel">
        <div class="info-row">
          <span class="info-label">Status</span>
          <span class="info-value" id="infoStatus">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">FPS</span>
          <span class="info-value" id="infoFps">0</span>
        </div>
        <div class="info-row">
          <span class="info-label">Inliers</span>
          <span class="info-value" id="infoInliers">0</span>
        </div>
        <div class="info-row">
          <span class="info-label">Confidence</span>
          <span class="info-value" id="infoConfidence">0%</span>
        </div>

        <div class="info-section">
          <div class="info-section-title">Camera</div>
          <div class="info-row">
            <span class="info-label">Resolution</span>
            <span class="info-value" id="infoCamRes">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">FOV</span>
            <span class="info-value" id="infoCamFov">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">fx, fy</span>
            <span class="info-value" id="infoCamFocal">-</span>
          </div>
        </div>

        <div class="info-section">
          <div class="info-section-title">Pose</div>
          <div class="info-row">
            <span class="info-label">Position</span>
            <span class="info-value" id="infoPosePos">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Distance</span>
            <span class="info-value" id="infoPoseDist">-</span>
          </div>
        </div>

        <div class="info-section">
          <div class="info-section-title">IMU</div>
          <div class="info-row">
            <span class="info-label">Status</span>
            <span class="info-value" id="infoImuStatus">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Alpha</span>
            <span class="info-value" id="infoImuAlpha">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Beta</span>
            <span class="info-value" id="infoImuBeta">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Gamma</span>
            <span class="info-value" id="infoImuGamma">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Linear Velocity</span>
            <span class="info-value" id="infoImuVel">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Rotation Delta</span>
            <span class="info-value" id="infoImuDelta">-</span>
          </div>
        </div>
      </div>

      <div class="start-overlay" id="startOverlay">
        <div class="start-title">WebAR Tracker</div>
        <div class="start-subtitle" id="startStatus">Connecting to server...</div>
        <div class="permission-status" id="permissionStatus">
          <div class="permission-item" id="permCamera">Pending Camera</div>
          <div class="permission-item" id="permMotion">Pending Motion Sensors</div>
          <div class="permission-item" id="permServer">Pending Server Connection</div>
        </div>
        <button class="start-btn" id="startBtn" disabled>Start AR Experience</button>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="/static/js/camera.js"></script>
    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/camera-intrinsics.js"></script>
    <script src="/static/js/device-motion.js"></script>
    <script src="/static/js/model-transform.js"></script>
    <script src="/static/js/model-renderer.js"></script>
    <script>
      class WebARApp {
        constructor() {
          this.intrinsicsManager = new CameraIntrinsicsManager()
          this.cameraManager = new CameraManager()
          this.wsManager = new WebSocketManager()
          this.modelRenderer = new ModelRenderer('threeCanvas')
          this.imuManager = new DeviceMotionManager()

          this.video = document.getElementById('videoElement')
          this.statusDot = document.getElementById('statusDot')
          this.badge = document.getElementById('detectionBadge')
          this.panel = document.getElementById('infoPanel')
          this.toggleBtn = document.getElementById('toggleBtn')
          this.startOverlay = document.getElementById('startOverlay')
          this.startBtn = document.getElementById('startBtn')
          this.startStatus = document.getElementById('startStatus')

          this.running = false
          this.showInfo = false
          this.pose = null
          this.debug = {}
          this.frameSequence = 0
          this.lastSend = 0
          this.currentSendInterval = 45
          this.minSendInterval = 35
          this.maxSendInterval = 80

          this.fps = 0
          this.frameCount = 0
          this.lastFpsTime = performance.now()

          this.sendCanvas = document.createElement('canvas')
          this.sendCtx = this.sendCanvas.getContext('2d', { alpha: false })

          this.cameraManager.setVideoElement(this.video)
          this.setupEvents()
          this.init()
        }

        init() {
          this.setPermissionState('permCamera', 'pending', 'Pending Camera')
          this.setPermissionState('permMotion', 'optional', 'Optional Motion Sensors')
          this.setPermissionState('permServer', 'pending', 'Pending Server Connection')
          this.connectWebSocket()
        }

        setPermissionState(elementId, state, label) {
          const element = document.getElementById(elementId)
          element.classList.remove('granted', 'denied', 'optional')
          if (state && state !== 'pending') {
            element.classList.add(state)
          }
          element.textContent = label
        }

        setupEvents() {
          this.startBtn.addEventListener('click', () => this.start())
          this.toggleBtn.addEventListener('click', () => {
            this.showInfo = !this.showInfo
            this.panel.classList.toggle('visible', this.showInfo)
            this.toggleBtn.classList.toggle('active', this.showInfo)
          })
          window.addEventListener('resize', () => this.handleResize())
        }

        connectWebSocket() {
          this.wsManager.onConnect(() => {
            this.statusDot.classList.add('connected')
            this.setPermissionState('permServer', 'granted', 'Server Connected')
          })

          this.wsManager.onDisconnect(() => {
            this.statusDot.classList.remove('connected')
            this.setPermissionState('permServer', 'denied', 'Server Disconnected')
            this.startBtn.disabled = true
          })

          this.wsManager.onStatus((data) => {
            if (data.ready) {
              this.startStatus.textContent = 'Ready to start'
              this.startBtn.disabled = false
            } else {
              this.startStatus.textContent = data.error || 'Target is not ready'
            }
          })

          this.wsManager.onResult((data) => this.handleResult(data))
          this.wsManager.onError((error) => {
            const message = error && error.message ? error.message : 'Connection error'
            this.startStatus.textContent = message
          })

          this.wsManager.connect().catch((error) => {
            this.startStatus.textContent = error.message
          })
        }

        async start() {
          if (this.running) {
            return
          }

          this.startBtn.disabled = true

          try {
            this.startStatus.textContent = 'Starting camera...'
            await this.cameraManager.start()
            this.setPermissionState('permCamera', 'granted', 'Camera Ready')

            await new Promise((resolve) => {
              if (this.video.videoWidth > 0) {
                resolve()
                return
              }
              this.video.addEventListener('loadedmetadata', resolve, { once: true })
            })

            const intrinsics = this.intrinsicsManager.initializeFromVideoStream(
              this.video.videoWidth,
              this.video.videoHeight
            )

            this.modelRenderer.setIntrinsics({
              fovVertical: intrinsics.fovVertical,
              fingerprint: this.intrinsicsManager.getFingerprint(),
            })

            this.handleResize()

            document.getElementById('infoCamRes').textContent =
              this.video.videoWidth + 'x' + this.video.videoHeight
            document.getElementById('infoCamFov').textContent =
              'H:' + intrinsics.fovHorizontal.toFixed(1) + ' V:' + intrinsics.fovVertical.toFixed(1)
            document.getElementById('infoCamFocal').textContent =
              intrinsics.fx.toFixed(0) + ', ' + intrinsics.fy.toFixed(0)

            this.startStatus.textContent = 'Starting motion sensors...'
            const imuGranted = await this.imuManager.requestPermission()
            if (imuGranted) {
              this.setPermissionState('permMotion', 'granted', 'Motion Sensors Ready')
              this.modelRenderer.setIMUManager(this.imuManager)
            } else {
              this.setPermissionState('permMotion', 'optional', 'Motion Sensors Unavailable')
            }

            this.running = true
            this.startOverlay.classList.add('hidden')
            this.lastSend = performance.now()
            this.loop()
          } catch (error) {
            console.error('[App] Start failed:', error)
            this.startStatus.textContent = 'Failed: ' + error.message
            this.startBtn.disabled = false
          }
        }

        handleResize() {
          if (!this.video.videoWidth) {
            return
          }

          const rect = this.video.getBoundingClientRect()
          this.modelRenderer.resize(rect.width, rect.height, {
            sourceWidth: this.video.videoWidth,
            sourceHeight: this.video.videoHeight,
            fitMode: 'cover',
          })
        }

        loop() {
          if (!this.running) {
            return
          }

          requestAnimationFrame(() => this.loop())
          this.modelRenderer.render()
          this.badge.classList.toggle('visible', this.modelRenderer.hasTracking())
          this.updateLocalInfo()

          const now = performance.now()
          if (this.wsManager.isReady() && this.video.videoWidth && now - this.lastSend >= this.currentSendInterval) {
            this.sendFrame()
            this.lastSend = now
          }

          this.frameCount += 1
          if (now - this.lastFpsTime > 1000) {
            this.fps = this.frameCount
            this.frameCount = 0
            this.lastFpsTime = now
          }
        }

        sendFrame() {
          const maxDim = 640
          const scale = Math.min(
            1,
            maxDim / Math.max(this.video.videoWidth, this.video.videoHeight)
          )
          const frameWidth = Math.floor(this.video.videoWidth * scale)
          const frameHeight = Math.floor(this.video.videoHeight * scale)

          if (this.sendCanvas.width !== frameWidth || this.sendCanvas.height !== frameHeight) {
            this.sendCanvas.width = frameWidth
            this.sendCanvas.height = frameHeight
          }

          this.sendCtx.drawImage(this.video, 0, 0, frameWidth, frameHeight)

          const frameId = ++this.frameSequence
          if (this.imuManager.isActive) {
            this.modelRenderer.saveIMUBaseline(frameId, this.imuManager.getTrackingQuaternion())
          }

          const intrinsics = this.intrinsicsManager.getIntrinsicsForFrame(frameWidth, frameHeight)
          const frameData = this.sendCanvas.toDataURL('image/jpeg', 0.42)
          this.wsManager.sendFrameWithIntrinsics(frameData, intrinsics, frameId)
        }

        computeNextSendInterval(debug) {
          const procMs = Number((debug && debug.proc_ms) || 0)
          if (!procMs) {
            return this.currentSendInterval
          }

          let next = Math.max(this.minSendInterval, Math.min(this.maxSendInterval, procMs * 0.85))
          if (Number((debug && debug.queue_drops) || 0) > 5) {
            next = Math.min(this.maxSendInterval, next + 10)
          }
          return next
        }

        handleResult(data) {
          this.debug = data.debug || {}
          this.currentSendInterval = this.computeNextSendInterval(this.debug)

          if (data.detected && data.pose) {
            this.pose = data.pose
            if (this.imuManager.isActive && !this.imuManager.hasReference) {
              this.imuManager.setReference()
            }
            this.modelRenderer.updatePose(data)
          } else {
            this.modelRenderer.handleVisionGap(data.debug || {})
            if (!this.modelRenderer.hasTracking()) {
              this.pose = null
              if (this.imuManager.hasReference) {
                this.imuManager.clearReference()
              }
            }
          }

          this.updateBackendInfo()
        }

        updateBackendInfo() {
          const renderState = this.modelRenderer.getRenderState()
          const stateEl = document.getElementById('infoStatus')
          stateEl.textContent = renderState
          stateEl.style.color =
            renderState === 'TRACKING'
              ? '#00ff88'
              : renderState === 'PREDICTING'
                ? '#f5c451'
                : '#ffffff'

          document.getElementById('infoInliers').textContent = this.debug.inliers || 0

          const confidence =
            typeof this.debug.tracking_confidence === 'number'
              ? this.debug.tracking_confidence
              : typeof this.debug.confidence === 'number'
                ? this.debug.confidence
                : 0
          document.getElementById('infoConfidence').textContent =
            Math.round(confidence * 100) + '%'

          const snapshot = this.modelRenderer.getPoseSnapshot()
          if (snapshot) {
            const pos = snapshot.position
            document.getElementById('infoPosePos').textContent =
              pos.x.toFixed(2) + ', ' + pos.y.toFixed(2) + ', ' + pos.z.toFixed(2)
            document.getElementById('infoPoseDist').textContent =
              Math.sqrt(pos.x * pos.x + pos.y * pos.y + pos.z * pos.z).toFixed(2) + 'm'
          } else if (this.pose && this.pose.position) {
            const pos = this.pose.position
            document.getElementById('infoPosePos').textContent =
              pos.x.toFixed(2) + ', ' + pos.y.toFixed(2) + ', ' + pos.z.toFixed(2)
            document.getElementById('infoPoseDist').textContent =
              this.pose.distance.toFixed(2) + 'm'
          } else {
            document.getElementById('infoPosePos').textContent = '-'
            document.getElementById('infoPoseDist').textContent = '-'
          }
        }

        updateLocalInfo() {
          document.getElementById('infoFps').textContent = this.fps

          const statusEl = document.getElementById('infoImuStatus')
          statusEl.textContent = this.imuManager.isActive ? 'Active' : 'Inactive'
          statusEl.style.color = this.imuManager.isActive ? '#00ff88' : '#888888'

          if (this.imuManager.isActive) {
            const orient = this.imuManager.orientation
            document.getElementById('infoImuAlpha').textContent = orient.alpha.toFixed(1)
            document.getElementById('infoImuBeta').textContent = orient.beta.toFixed(1)
            document.getElementById('infoImuGamma').textContent = orient.gamma.toFixed(1)
            document.getElementById('infoImuVel').textContent =
              this.imuManager.linVel.length().toFixed(3) + ' m/s'
            document.getElementById('infoImuDelta').textContent =
              this.imuManager.hasReference
                ? this.imuManager.getRotationMagnitude().toFixed(1) + ' deg'
                : 'No reference'
          } else {
            document.getElementById('infoImuAlpha').textContent = '-'
            document.getElementById('infoImuBeta').textContent = '-'
            document.getElementById('infoImuGamma').textContent = '-'
            document.getElementById('infoImuVel').textContent = '-'
            document.getElementById('infoImuDelta').textContent = '-'
          }
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        window.app = new WebARApp()
      })
    </script>
  </body>
</html>
