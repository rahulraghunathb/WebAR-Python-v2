<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Alignment</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #173049, #081019 70%);
        color: #f2f7fb;
        font-family: 'Segoe UI', Roboto, sans-serif;
      }

      .card {
        width: min(520px, calc(100vw - 40px));
        padding: 32px;
        border-radius: 20px;
        background: rgba(8, 16, 25, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 18px;
        line-height: 1.6;
        color: #c0d2de;
      }

      a {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        background: #00c870;
        color: #041009;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Model alignment moved</h1>
      <p>
        Use the canonical alignment workflow so the exported transform matches the
        runtime renderer exactly.
      </p>
      <a href="/static/alignment-tool/index.html">Open Alignment Tool</a>
    </div>
  </body>
</html>
