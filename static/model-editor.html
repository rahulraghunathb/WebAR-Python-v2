<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        h1 {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 20px;
            color: #00ff88;
        }

        .preview-area {
            background: #0f0f23;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
        }

        #threeCanvas {
            width: 100%;
            height: 100%;
        }

        .controls-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 4px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
        }

        .value-display {
            font-size: 14px;
            color: #00ff88;
            text-align: right;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .config-output {
            margin-top: auto;
            background: #0a0a15;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            color: #00ff88;
            max-height: 150px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎮 3D Model Editor</h1>

        <div class="preview-area">
            <canvas id="threeCanvas"></canvas>
        </div>

        <div class="controls-panel">
            <div class="section-title">Position</div>

            <div class="control-group">
                <label>X Offset</label>
                <input type="range" id="posX" min="-2" max="2" step="0.01" value="0">
                <span class="value-display" id="posXVal">0.00</span>
            </div>

            <div class="control-group">
                <label>Y Offset</label>
                <input type="range" id="posY" min="-2" max="2" step="0.01" value="0">
                <span class="value-display" id="posYVal">0.00</span>
            </div>

            <div class="control-group">
                <label>Z Offset (Depth)</label>
                <input type="range" id="posZ" min="-5" max="0" step="0.1" value="-3">
                <span class="value-display" id="posZVal">-3.00</span>
            </div>

            <div class="section-title">Scale & Rotation</div>

            <div class="control-group">
                <label>Scale</label>
                <input type="range" id="scale" min="0.01" max="2" step="0.01" value="0.5">
                <span class="value-display" id="scaleVal">0.50</span>
            </div>

            <div class="control-group">
                <label>Rotation Y</label>
                <input type="range" id="rotY" min="-180" max="180" step="1" value="0">
                <span class="value-display" id="rotYVal">0°</span>
            </div>

            <button class="btn btn-secondary" onclick="resetValues()">Reset</button>
            <button class="btn btn-primary" onclick="copyConfig()">Copy Config</button>

            <div class="config-output" id="configOutput">
                // Configuration will appear here
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, model, controls;
        let config = {
            posX: 0,
            posY: 0,
            posZ: -3,
            scale: 0.5,
            rotY: 0
        };

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f0f23);

            // Camera
            camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.1, 100);
            camera.position.set(0, 0, 2);

            // Renderer
            const canvas = document.getElementById('threeCanvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const directional = new THREE.DirectionalLight(0xffffff, 0.8);
            directional.position.set(2, 4, 3);
            scene.add(directional);

            // Target reference plane (represents the image target)
            const planeGeometry = new THREE.PlaneGeometry(1, 1);
            const planeMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.position.z = -3;
            scene.add(plane);

            // Border for plane
            const edges = new THREE.EdgesGeometry(planeGeometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ff88 }));
            line.position.z = -3;
            scene.add(line);

            // Load model
            const loader = new THREE.GLTFLoader();
            loader.load('/static/assets/ranger-3d-model.glb', (gltf) => {
                model = gltf.scene;

                // Center model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);

                // Normalize scale
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                model.scale.setScalar(1 / maxDim);

                scene.add(model);
                updateModel();
                console.log('✓ Model loaded');
            });

            // Setup controls
            setupControls();
            animate();
        }

        function setupControls() {
            const inputs = ['posX', 'posY', 'posZ', 'scale', 'rotY'];
            inputs.forEach(id => {
                const input = document.getElementById(id);
                input.addEventListener('input', () => {
                    config[id] = parseFloat(input.value);
                    document.getElementById(id + 'Val').textContent =
                        id === 'rotY' ? input.value + '°' : parseFloat(input.value).toFixed(2);
                    updateModel();
                    updateConfigOutput();
                });
            });
        }

        function updateModel() {
            if (!model) return;
            model.position.set(config.posX, config.posY, config.posZ);
            model.scale.setScalar(config.scale);
            model.rotation.y = config.rotY * Math.PI / 180;
        }

        function updateConfigOutput() {
            const output = document.getElementById('configOutput');
            output.textContent = JSON.stringify({
                position: { x: config.posX, y: config.posY, z: config.posZ },
                scale: config.scale,
                rotationY: config.rotY
            }, null, 2);
        }

        function resetValues() {
            config = { posX: 0, posY: 0, posZ: -3, scale: 0.5, rotY: 0 };
            document.getElementById('posX').value = 0;
            document.getElementById('posY').value = 0;
            document.getElementById('posZ').value = -3;
            document.getElementById('scale').value = 0.5;
            document.getElementById('rotY').value = 0;
            ['posX', 'posY', 'posZ', 'scale', 'rotY'].forEach(id => {
                document.getElementById(id + 'Val').textContent =
                    id === 'rotY' ? '0°' : parseFloat(document.getElementById(id).value).toFixed(2);
            });
            updateModel();
            updateConfigOutput();
        }

        function copyConfig() {
            const configText = JSON.stringify(config, null, 2);
            navigator.clipboard.writeText(configText).then(() => {
                alert('Configuration copied to clipboard!');
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('threeCanvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        });

        init();
        updateConfigOutput();
    </script>
</body>

</html>
